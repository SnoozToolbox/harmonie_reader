name: Build HarmonieReader Windows

on:
  workflow_dispatch:
    inputs:
      create_release_artifact:
        description: 'Upload compiled HarmonieReader.pyd as workflow artifact'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
      - feature/header_writer
    paths:
      - CMakeLists.txt
      - .gitmodules
      - src/**
      - extern/pybind11/**
      - .github/workflows/build_harmonie_reader_windows.yml

jobs:
  build_windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Ensure pybind11 sources are available
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          if [ ! -f extern/pybind11/CMakeLists.txt ]; then
            rm -rf extern/pybind11
            git clone --depth 1 --branch stable https://github.com/pybind/pybind11.git extern/pybind11
          fi
          ls -la extern/pybind11

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10.11'

      - name: Show build environment
        shell: bash
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          python --version
          cmake --version

      - name: Configure and build HarmonieReader
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target HarmonieReader

      - name: Collect generated Python extension
        shell: bash
        run: |
          mkdir -p out
          HARMONIE_PYD=$(find build -name "HarmonieReader*.pyd" -type f | head -n 1)
          if [ -z "$HARMONIE_PYD" ]; then
            echo "HarmonieReader Python extension not found in build output"
            find build -type f -name "HarmonieReader*" || true
            exit 1
          fi
          cp "$HARMONIE_PYD" out/HarmonieReader.cp310-win_amd64.pyd
          tar -czf out/HarmonieReader-windows-x86_64.tar.gz -C out HarmonieReader.cp310-win_amd64.pyd
          ls -la out

      - name: Upload artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: HarmonieReader-windows-x86_64
          path: out/HarmonieReader-windows-x86_64.tar.gz
          retention-days: 2
